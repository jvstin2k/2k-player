# Every merge to main builds a Windows installer and publishes it as a release in the public release repo.
# Pull requests run the same build without publishing, so a broken Windows build shows up before the merge.
# Installed players check that repo on start and update themselves (see src/TwoKPlayer.App/Updater.cs).
# Needs the secret RELEASES_TOKEN: a fine-grained token with "Contents: read and write" on 2k-player-releases.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

# Releases queue one after another; pull request builds get their own group, so they never push a release
# out of the queue (that cancelled the release after PR #7).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}

env:
  RELEASES_REPO: https://github.com/jvstin2k/2k-player-releases

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes list the commits of the merged pull request

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test tests/TwoKPlayer.Core.Tests

      - name: Fetch libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-libmpv.ps1

      - name: Publish
        shell: pwsh
        run: |
          # The version shows in Settings; installed copies read it from Velopack, this is for everything else.
          dotnet publish src/TwoKPlayer.App -c Release -r win-x64 -p:Platform=x64 -p:Version=1.0.${{ github.run_number }} --self-contained -o publish
          if ($LASTEXITCODE) { throw "dotnet publish failed" }
          Get-ChildItem publish -Recurse -File -Exclude *.dll | ForEach-Object { $_.FullName.Substring((Resolve-Path publish).Path.Length + 1) }
          # Without the .pri the app has no XAML resources and Windows kills it at start, before it can log anything.
          if (-not (Test-Path publish/TwoKPlayer.App.pri)) { throw "TwoKPlayer.App.pri is missing from the publish output" }

      - name: Smoke test (fullscreen and cursor)
        shell: pwsh
        run: |
          # Runs the published build like an installed one: plays a test picture, enters and leaves fullscreen and
          # checks the cursor over the video. See src/TwoKPlayer.App/MainWindow.SmokeTest.cs.
          $env:TWOKPLAYER_SMOKE_TEST = '1'
          $app = Start-Process publish/TwoKPlayer.App.exe -PassThru
          if (-not $app.WaitForExit(90000)) { $app.Kill(); Write-Host 'Timed out' }
          Remove-Item Env:TWOKPLAYER_SMOKE_TEST
          $data = Join-Path $env:LOCALAPPDATA '2kPlayer'
          foreach ($file in 'smoke.log', 'crash.log', 'winui-errors.log') {
            if (Test-Path "$data/$file") { Write-Host "--- $file"; Get-Content "$data/$file" }
          }
          # A WinUI fail-fast or a crash in libmpv never reaches crash.log, only the event log.
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "--- event $($_.ProviderName)"; Write-Host $_.Message }
          if ($app.ExitCode -ne 0) { throw "Smoke test failed, exit code $($app.ExitCode) (0x$('{0:x8}' -f $app.ExitCode))" }

      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Fetch earlier releases
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:RELEASES_TOKEN) { throw 'Secret RELEASES_TOKEN fehlt, siehe README.' }
          # Lets vpk build small delta updates. The very first run finds none, which is fine.
          vpk download github --repoUrl $env:RELEASES_REPO --token $env:RELEASES_TOKEN
          exit 0

      - name: Release notes
        shell: pwsh
        run: |
          # A merge commit lists the pull request's commits; a direct push lists just that commit.
          git rev-parse -q --verify HEAD^2 *> $null
          $range = if ($LASTEXITCODE -eq 0) { 'HEAD^1..HEAD^2' } else { 'HEAD~1..HEAD' }
          $changes = git log --no-merges --format='- %s' $range
          $tag, $asset, $assetUrl = (Get-Content src/TwoKPlayer.App/libmpv/VERSION.txt).Split(' ')
          @(
            'Windows IPTV player for M3U playlists, Xtream Codes and XMLTV EPG.'
            ''
            '**New here?** Download `2k-Player-win-Setup.exe` below and run it. If Windows shows "Windows protected your PC", click *More info → Run anyway*.'
            ''
            '**Already installed?** Click *Update … installieren* at the bottom left of the player. Your sources, logins and settings are kept.'
            ''
            '### Changes'
            $changes
            ''
            '### Source and license'
            'Free software under GPL-3.0-or-later. Source code and build instructions: https://github.com/jvstin2k/2k-player'
            "Bundled libmpv: [$asset]($assetUrl) from shinchiro/mpv-winbuild-cmake $tag (GPL, source: https://github.com/mpv-player/mpv)"
          ) | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Pack
        shell: pwsh
        run: |
          # packId differs from the data folder %LOCALAPPDATA%\2kPlayer, which an uninstall must not delete.
          vpk pack --packId 2k-Player --runtime win-x64 --packVersion "1.0.${{ github.run_number }}" --packDir publish --mainExe TwoKPlayer.App.exe --packTitle "2k-Player" --icon src/TwoKPlayer.App/Assets/AppIcon.ico --releaseNotes release-notes.md
          if ($LASTEXITCODE) { throw "vpk pack failed" }

      - name: Upload release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $version = "1.0.${{ github.run_number }}"
          vpk upload github --repoUrl $env:RELEASES_REPO --token $env:RELEASES_TOKEN --publish --releaseName "2k-Player $version" --tag "v$version"
          if ($LASTEXITCODE) { throw "vpk upload failed" }

      - name: Keep the installer of a pull request for testing
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: 2k-Player-Setup
          path: Releases/*Setup.exe

      - name: Update the release repo's page
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # The public page comes from docs/releases-repo, so it is edited here together with the code.
          $url = $env:RELEASES_REPO -replace '^https://', "https://x-access-token:$($env:RELEASES_TOKEN)@"
          git clone --depth 1 $url releases-page
          Copy-Item docs/releases-repo/* releases-page/ -Force
          if (Get-ChildItem docs/screenshots/*.jpg -ErrorAction SilentlyContinue) {
            New-Item -ItemType Directory releases-page/screenshots -Force | Out-Null
            Copy-Item docs/screenshots/*.jpg releases-page/screenshots/ -Force
          }
          Set-Location releases-page
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git status --porcelain) { git commit -m 'Update project page'; git push }
